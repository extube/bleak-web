# bleak-web deployment: static SPA on port 3000.
#
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f
# Stop:   docker compose down
#
# This container serves ONLY the static SPA (port 3000). TLS termination
# and API routing live on the host's nginx:
#   https://<site>        -> http://127.0.0.1:3000  (this container)
#   https://api.notext.tech -> http://127.0.0.1:8989 (bleak-node)
# The SPA calls same-origin /api/*, which the host nginx forwards to
# bleak-node — no CORS, no proxy inside this container.

services:
  web:
    build: .
    image: bleak-web:latest
    container_name: bleak-web
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
